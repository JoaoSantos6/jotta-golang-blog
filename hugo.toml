baseURL = 'https://JoaoSantos6.github.io/jotta-golang-blog/'
locale = 'pt-br'
title = 'Blog de Estudos em Go'
theme = 'hugo-theme-stack'

[pagination]
  pagerSize = 10

[taxonomies]
  tag = 'tags'

[permalinks]
  page = '/:slug/'

[markup]
  [markup.highlight]
    noClasses = false
    style = 'github'

[params]
  env = 'production'
  description = 'Anotações, exercícios e projetos pequenos enquanto aprendo Go.'
  mainSections = ['posts']

  [params.sidebar]
    avatar = 'img/avatar.svg'
    subtitle = 'Anotações, exercícios e projetos pequenos enquanto aprendo Go.'
    emoji = '🐹'

  [params.article]
    readingTime = true

  [params.comments]
    enabled = false

  [params.colorScheme]
    toggle = true
    default = 'auto'

  [params.widgets]
    homepage = [
      { type = 'search' },
      { type = 'archives', params = { limit = 5 } },
      { type = 'tag-cloud', params = { limit = 10 } },
    ]

[[menu.main]]
  identifier = 'posts'
  name = 'Posts'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'tags'
  name = 'Tags'
  url = '/tags/'
  weight = 20

[[menu.main]]
  identifier = 'about'
  name = 'Sobre'
  url = '/about/'
  weight = 30

[[menu.social]]
  identifier = 'github'
  name = 'GitHub'
  url = 'https://github.com/JoaoSantos6'
  [menu.social.params]
    icon = 'brand-github'
